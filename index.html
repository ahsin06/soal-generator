        let memorySessionFallback = {};

        function setSessionCookie(name, value, days = 7) {
            memorySessionFallback[name] = value;
            try {
                const d = new Date();
                d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
                document.cookie = `${name}=${encodeURIComponent(value)};expires=${d.toUTCString()};path=/;SameSite=Lax`;
            } catch (e) {
                // Sandbox iframe tanpa allow-same-origin memakai memory fallback
            }
        }

        function getSessionCookie(name) {
            try {
                const nameEQ = name + "=";
                const ca = document.cookie.split(';');
                for (let i = 0; i < ca.length; i++) {
                    let c = ca[i].trim();
                    if (c.indexOf(nameEQ) === 0) {
                        return decodeURIComponent(c.substring(nameEQ.length, c.length));
                    }
                }
            } catch (e) {
                // Abaikan SecurityError pada sandbox iframe
            }
            return memorySessionFallback[name] || '';
        }

        function clearSessionCookie(name) {
            delete memorySessionFallback[name];
            try {
                document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 UTC;path=/;SameSite=Lax`;
            } catch (e) {
                // Abaikan SecurityError pada sandbox iframe
            }

        // Proses penghapusan background otomatis untuk logo kop (PNG transparan)
        function processLogoTransparent(file, maxWidth = 300) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxWidth / img.width);
                        const w = Math.max(1, Math.round(img.width * scale));
                        const h = Math.max(1, Math.round(img.height * scale));
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);

                        const imgData = ctx.getImageData(0, 0, w, h);
                        const data = imgData.data;

                        const cornerOffsets = [0, (w - 1) * 4, ((h - 1) * w) * 4, ((h - 1) * w + (w - 1)) * 4];
                        let bgR = 0, bgG = 0, bgB = 0, validCorners = 0;
                        cornerOffsets.forEach(off => {
                            if (data[off + 3] > 200) {
                                bgR += data[off];
                                bgG += data[off + 1];
                                bgB += data[off + 2];
                                validCorners++;
                            }
                        });

                        if (validCorners > 0) {
                            bgR = Math.round(bgR / validCorners);
                            bgG = Math.round(bgG / validCorners);
                            bgB = Math.round(bgB / validCorners);

                            const visited = new Uint8Array(w * h);
                            const stack = [];
                            const tolerance = 52;

                            const isBgColor = (idx) => {
                                const off = idx * 4;
                                if (data[off + 3] < 20) return true;
                                const dist = Math.sqrt(
                                    Math.pow(data[off] - bgR, 2) +
                                    Math.pow(data[off + 1] - bgG, 2) +
                                    Math.pow(data[off + 2] - bgB, 2)
                                );
                                return dist <= tolerance;
                            };

                            for (let x = 0; x < w; x++) {
                                const topIdx = x;
                                const botIdx = (h - 1) * w + x;
                                if (!visited[topIdx] && isBgColor(topIdx)) { visited[topIdx] = 1; stack.push(topIdx); }
                                if (!visited[botIdx] && isBgColor(botIdx)) { visited[botIdx] = 1; stack.push(botIdx); }
                            }
                            for (let y = 0; y < h; y++) {
                                const leftIdx = y * w;
                                const rightIdx = y * w + (w - 1);
                                if (!visited[leftIdx] && isBgColor(leftIdx)) { visited[leftIdx] = 1; stack.push(leftIdx); }
                                if (!visited[rightIdx] && isBgColor(rightIdx)) { visited[rightIdx] = 1; stack.push(rightIdx); }
                            }

                            while (stack.length > 0) {
                                const curr = stack.pop();
                                const off = curr * 4;
                                data[off + 3] = 0;

                                const cx = curr % w;
                                const cy = (curr - cx) / w;
                                const neighbors = [];
                                if (cx > 0) neighbors.push(curr - 1);
                                if (cx < w - 1) neighbors.push(curr + 1);
                                if (cy > 0) neighbors.push(curr - w);
                                if (cy < h - 1) neighbors.push(curr + w);

                                for (let i = 0; i < neighbors.length; i++) {
                                    const nIdx = neighbors[i];
                                    if (!visited[nIdx] && isBgColor(nIdx)) {
                                        visited[nIdx] = 1;
                                        stack.push(nIdx);
                                    }
                                }
                            }
                            ctx.putImageData(imgData, 0, 0);
                        }

                        resolve(canvas.toDataURL('image/png'));
                    };
                    img.onerror = reject;
                    img.src = ev.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

                reader.readAsDataURL(file);
            });
        }

        // Pengacakan & pemerataan huruf kunci jawaban (A, B, C, D, E) pada soal Pilihan Ganda
        function shuffleAndBalanceChoices(questions) {
            if (!Array.isArray(questions) || questions.length === 0) return [];
            const cloned = JSON.parse(JSON.stringify(questions));

            const pgIndices = [];
            cloned.forEach((q, idx) => {
                const b = (q.bentukSoal || '').toLowerCase();
                if (
                    Array.isArray(q.pilihan) &&
                    q.pilihan.length >= 4 &&
                    !b.includes('kompleks') &&
                    !b.includes('benar')
                ) {
                    pgIndices.push(idx);
                }
            });

            if (pgIndices.length === 0) return cloned;

            const optCount = cloned[pgIndices[0]].pilihan.length;
            const letters = ['A', 'B', 'C', 'D', 'E'].slice(0, optCount);
            const targetLetters = [];
            while (targetLetters.length < pgIndices.length) {
                const block = [...letters];
                for (let i = block.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [block[i], block[j]] = [block[j], block[i]];
                }
                if (targetLetters.length > 0 && block[0] === targetLetters[targetLetters.length - 1] && block.length > 1) {
                    [block[0], block[1]] = [block[1], block[0]];
                }
                targetLetters.push(...block);
            }

            pgIndices.forEach((qIdx, orderIdx) => {
                const q = cloned[qIdx];
                const cleanOpts = q.pilihan.map(o => String(o || '').replace(/^[A-E][\.\)]\s*/i, '').trim());
                const rawKey = String(q.kunciJawaban || '').trim();
                const letterMatch = rawKey.match(/^([A-E])(?:[\.\)\s]|$)/i);
                let correctIdx = 0;

                if (letterMatch) {
                    const idxFromLetter = letterMatch[1].toUpperCase().charCodeAt(0) - 65;
                    if (idxFromLetter >= 0 && idxFromLetter < cleanOpts.length) {
                        correctIdx = idxFromLetter;
                    }
                } else {
                    const strippedKey = rawKey.replace(/^[A-E][\.\)]\s*/i, '').trim().toLowerCase();
                    const foundIdx = cleanOpts.findIndex(o => o.toLowerCase() === strippedKey);
                    if (foundIdx !== -1) correctIdx = foundIdx;
                }

                const correctText = cleanOpts[correctIdx] || cleanOpts[0];
                const distractors = cleanOpts.filter((_, i) => i !== correctIdx);
                for (let i = distractors.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [distractors[i], distractors[j]] = [distractors[j], distractors[i]];
                }

                const desiredLetter = targetLetters[orderIdx] || 'A';
                const desiredPos = Math.min(cleanOpts.length - 1, Math.max(0, desiredLetter.charCodeAt(0) - 65));

                const newOpts = [];
                let dPtr = 0;
                for (let pos = 0; pos < cleanOpts.length; pos++) {
                    if (pos === desiredPos) {
                        newOpts.push(correctText);
                    } else {
                        newOpts.push(distractors[dPtr++] || '');
                    }
                }

                q.pilihan = newOpts;
                q.kunciJawaban = `${String.fromCharCode(65 + desiredPos)}. ${correctText}`;
            });

            return cloned;
        }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

            const tgl = state.identitas.tanggalPembuatan || '.................... 20...';
            return { nama, npk, kota, tgl };

            if (!state.currentUser) return [];

            return state.savedArchives.filter(a => Boolean(a.penyusunId) && a.penyusunId === state.currentUser.id);
        }

        function getVisibleAgenda() {
            if (!state.currentUser) return [];

            return state.agendaList.filter(ag => ag.ownerId === state.currentUser.id);

        function isGuruIdentityIncomplete(guruObj) {
            if (!guruObj) return true;
            const idData = guruObj.identitas || {};
            const hasMadrasah = Boolean(idData.namaMadrasah && String(idData.namaMadrasah).trim());
            return guruObj.identitasCompleted !== true || !hasMadrasah;

        function detachFirestoreListeners() {
            if (unsubSettings) { unsubSettings(); unsubSettings = null; }
            if (unsubGuru) { unsubGuru(); unsubGuru = null; }
            if (unsubArchives) { unsubArchives(); unsubArchives = null; }
            if (unsubAgenda) { unsubAgenda(); unsubAgenda = null; }
        }

        function attachFirestoreListeners() {
            if (IS_PREVIEW || !fbDb) return;
            detachFirestoreListeners();
            if (!state.currentUser) return;

            if (state.currentUser.role === 'admin') {
                unsubSettings = onSnapshot(doc(fbDb, 'settings_madrasah', 'profil_utama'), (snap) => {
                    if (snap.exists()) {
                        state.identitas = { ...createBlankIdentitas(), ...snap.data() };
                        renderApp();
                    }
                }, (err) => console.warn("Listener settings:", err));

                unsubGuru = onSnapshot(collection(fbDb, 'users_guru'), (snap) => {
                    state.guruList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderApp();
                }, (err) => console.warn("Listener guru:", err));

                unsubArchives = onSnapshot(collection(fbDb, 'bank_soal_archives'), (snap) => {
                    const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    list.sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
                    state.savedArchives = list;
                    renderApp();
                }, (err) => console.warn("Listener archives:", err));

                unsubAgenda = onSnapshot(collection(fbDb, 'agenda_asesmen'), (snap) => {
                    state.agendaList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                    renderApp();
                }, (err) => console.warn("Listener agenda:", err));
            } else {
                unsubGuru = onSnapshot(doc(fbDb, 'users_guru', state.currentUser.id), (snap) => {
                    if (snap.exists()) {
                        const gData = snap.data();
                        state.currentUser = {
                            ...state.currentUser,
                            namaLengkap: gData.namaLengkap,
                            npk: gData.npk || gData.nip || '',
                            mapelAmpu: gData.mapelAmpu || '',
                            identitasCompleted: Boolean(gData.identitasCompleted)
                        };
                        state.identitas = { ...createBlankIdentitas(), ...(gData.identitas || {}) };
                        renderApp();
                    }
                }, (err) => console.warn("Listener profil guru:", err));

                const qMyArchives = query(collection(fbDb, 'bank_soal_archives'), where('penyusunId', '==', state.currentUser.id));
                unsubArchives = onSnapshot(qMyArchives, (snap) => {
                    const list = snap.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(item => item.penyusunId === state.currentUser.id);
                    list.sort((a, b) => (b.createdAtMs || 0) - (a.createdAtMs || 0));
                    state.savedArchives = list;
                    renderApp();
                }, (err) => console.warn("Listener my archives:", err));

                const qMyAgenda = query(collection(fbDb, 'agenda_asesmen'), where('ownerId', '==', state.currentUser.id));

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const username = state.loginForm.username.trim();
            const password = state.loginForm.password;

            if (!username || !password) {
                showNotif('Harap isi Username/Email dan Password!', 'error');
                return;
            }

            if (state.authTab === 'admin') {
                if (IS_PREVIEW) {
                    state.currentUser = {
                        id: 'admin-preview',
                        role: 'admin',
                        username: username,
                        namaLengkap: 'Admin Madrasah',
                        npk: '197505102000031'
                    };
                    state.needsIdentitySetup = false;
                    state.identitas = { ...defaultIdentitas };
                    state.bankSoal = [...previewDemoArchives[0].soal];
                    state.activeArchiveId = 'demo-arc-1';
                    state.activePage = 'dashboard';
                    showNotif('Berhasil masuk sebagai Admin Madrasah (Mode Preview)');
                    renderApp();
                    return;
                }

                if (!fbAuth) {
                    showNotif('Konfigurasi Firebase belum valid. Periksa firebaseConfig.', 'error');
                    return;
                }

                try {
                    await signInWithEmailAndPassword(fbAuth, username, password);
                    showNotif('Selamat datang, Admin Madrasah!');
                } catch (err) {
                    console.error(err);
                    showNotif('Login Admin gagal: Email atau password tidak sesuai.', 'error');
                }
            } else {
                if (IS_PREVIEW) {
                    const found = state.guruList.find(
                        g => g.username.toLowerCase() === username.toLowerCase() && g.password === password
                    );
                    if (!found) {
                        showNotif('Username atau password Guru tidak ditemukan. Silakan daftar akun terlebih dahulu.', 'error');
                        return;
                    }
                    if (!found.approved) {
                        showNotif('Akun Anda masih menunggu persetujuan (Approve) dari Admin Madrasah.', 'error');
                        return;
                    }
                    const needsSetup = isGuruIdentityIncomplete(found);
                    state.currentUser = {
                        id: found.id,
                        role: 'guru',
                        username: found.username,
                        namaLengkap: found.namaLengkap,
                        npk: found.npk || found.nip || '',
                        mapelAmpu: found.mapelAmpu || '',
                        identitasCompleted: Boolean(found.identitasCompleted)
                    };
                    state.identitas = { ...createBlankIdentitas(), ...(found.identitas || {}) };
                    state.bankSoal = [];
                    state.activeArchiveId = null;
                    state.needsIdentitySetup = needsSetup;
                    if (needsSetup) {
                        state.activePage = 'identitas';
                        showNotif('Selamat datang! Silakan isi Data Identitas Madrasah & Profil Anda terlebih dahulu.');
                    } else {
                        state.activePage = 'dashboard';
                        showNotif(`Assalamu'alaikum, ${found.namaLengkap}!`);
                    }
                    renderApp();
                    return;
                }

                if (!fbDb) {
                    showNotif('Koneksi database Firestore belum tersedia.', 'error');
                    return;
                }

                try {
                    const q = query(collection(fbDb, 'users_guru'), where('username', '==', username.toLowerCase()));
                    const snap = await getDocs(q);
                    if (snap.empty) {
                        showNotif('Akun Guru belum terdaftar. Silakan klik "Daftar & Buat Akun".', 'error');
                        return;
                    }
                    let matchedDoc = null;
                    snap.forEach(d => {
                        if (d.data().password === password) matchedDoc = d;
                    });
                    if (!matchedDoc) {
                        showNotif('Password yang Anda masukkan salah.', 'error');
                        return;
                    }
                    const gData = matchedDoc.data();
                    if (gData.approved !== true) {
                        showNotif('Akun Anda belum di-Approve oleh Admin. Silakan hubungi Admin Madrasah.', 'error');
                        return;
                    }
                    setSessionCookie('madrasah_guru_uid', matchedDoc.id, 7);
                    const needsSetup = isGuruIdentityIncomplete(gData);
                    state.currentUser = {
                        id: matchedDoc.id,
                        role: 'guru',
                        username: gData.username,
                        namaLengkap: gData.namaLengkap,
                        npk: gData.npk || gData.nip || '',
                        mapelAmpu: gData.mapelAmpu || '',
                        identitasCompleted: Boolean(gData.identitasCompleted)
                    };
                    state.identitas = { ...createBlankIdentitas(), ...(gData.identitas || {}) };
                    state.savedArchives = [];
                    state.agendaList = [];
                    state.bankSoal = [];
                    state.activeArchiveId = null;
                    state.needsIdentitySetup = needsSetup;
                    attachFirestoreListeners();
                    if (needsSetup) {
                        state.activePage = 'identitas';
                        showNotif('Selamat datang! Lengkapi Data Identitas Madrasah & Profil Anda terlebih dahulu.');
                    } else {
                        state.activePage = 'dashboard';
                        showNotif(`Selamat datang, ${gData.namaLengkap}!`);
                    }
                    renderApp();
                } catch (err) {
                    console.error(err);
                    showNotif('Terjadi kesalahan saat memverifikasi akun Guru.', 'error');
                }
            }
        }

        async function handleRegisterGuruSubmit(e) {
            e.preventDefault();
            const namaLengkap = state.registerForm.namaLengkap.trim();
            const username = state.registerForm.username.trim().toLowerCase();
            const password = state.registerForm.password;
            const confirmPassword = state.registerForm.confirmPassword;

            if (!namaLengkap || !username || !password || !confirmPassword) {
                showNotif('Semua kolom pendaftaran wajib diisi!', 'error');
                return;
            }
            if (username.length < 4) {
                showNotif('Username minimal 4 karakter tanpa spasi.', 'error');
                return;
            }
            if (password.length < 4) {
                showNotif('Password minimal 4 karakter.', 'error');
                return;
            }
            if (password !== confirmPassword) {
                showNotif('Konfirmasi password tidak cocok!', 'error');
                return;
            }

            if (IS_PREVIEW) {
                const exists = state.guruList.some(g => g.username.toLowerCase() === username);
                if (exists) {
                    showNotif('Username sudah digunakan oleh guru lain.', 'error');
                    return;
                }
                state.guruList.push({
                    id: 'guru-' + Date.now(),
                    username,
                    password,
                    npk: '',
                    mapelAmpu: '',
                    namaLengkap,
                    approved: false,
                    identitasCompleted: false,
                    identitas: createBlankIdentitas()
                });
                state.registerForm = { namaLengkap: '', username: '', password: '', confirmPassword: '' };
                state.authMode = 'login';
                showNotif('Pendaftaran berhasil! Silakan tunggu persetujuan (Approve) dari Admin Madrasah.');
                renderApp();
                return;
            }

            if (!fbDb) {
                showNotif('Koneksi database Firestore belum tersedia.', 'error');
                return;
            }

            try {
                const q = query(collection(fbDb, 'users_guru'), where('username', '==', username));
                const existing = await getDocs(q);
                if (!existing.empty) {
                    showNotif('Username sudah terdaftar. Gunakan username lain.', 'error');
                    return;
                }

                await addDoc(collection(fbDb, 'users_guru'), {
                    namaLengkap,
                    username,
                    password,
                    npk: '',
                    mapelAmpu: '',
                    approved: false,
                    identitasCompleted: false,
                    identitas: createBlankIdentitas(),
                    createdAt: serverTimestamp()
                });

                state.registerForm = { namaLengkap: '', username: '', password: '', confirmPassword: '' };
                state.authMode = 'login';
                showNotif('Pendaftaran berhasil! Akun menunggu persetujuan Admin Madrasah sebelum dapat masuk.');
                renderApp();
            } catch (err) {
                console.error(err);
                showNotif('Gagal mengirim pendaftaran akun ke database.', 'error');
            }
        }

        async function handleLogout() {
            clearSessionCookie('madrasah_guru_uid');
            if (!IS_PREVIEW && fbAuth && state.currentUser?.role === 'admin') {
                try { await signOut(fbAuth); } catch (e) {}

            if (!IS_PREVIEW) {
                state.savedArchives = [];
                state.agendaList = [];
            }
            state.bankSoal = [];
            state.activeArchiveId = null;
            state.activePage = 'dashboard';
            showNotif('Anda telah keluar dari sesi.');
            renderApp();

        async function handleSaveIdentitas() {
            if (state.currentUser?.role === 'guru') {
                const namaLengkap = (document.getElementById('prof-guru-nama')?.value ?? state.currentUser.namaLengkap ?? '').trim();
                const npk = (document.getElementById('prof-guru-npk')?.value ?? state.currentUser.npk ?? state.currentUser.nip ?? '').trim();
                const mapelAmpu = (document.getElementById('prof-guru-mapel')?.value ?? state.currentUser.mapelAmpu ?? '').trim();

                if (!namaLengkap) {
                    showNotif('Nama Guru / Penyusun wajib diisi!', 'error');
                    return;
                }
                if (!state.identitas.namaMadrasah || !state.identitas.namaMadrasah.trim()) {
                    showNotif('Nama Madrasah wajib diisi terlebih dahulu!', 'error');
                    return;
                }

                const wasFirstSetup = state.needsIdentitySetup;
                const cleanIdentitas = { ...state.identitas };

                if (IS_PREVIEW) {
                    const idx = state.guruList.findIndex(g => g.id === state.currentUser.id);
                    if (idx !== -1) {
                        state.guruList[idx] = {
                            ...state.guruList[idx],
                            namaLengkap,
                            npk,
                            mapelAmpu,
                            identitasCompleted: true,
                            identitas: cleanIdentitas
                        };
                    }
                    state.currentUser = { ...state.currentUser, namaLengkap, npk, mapelAmpu, identitasCompleted: true };
                    state.needsIdentitySetup = false;
                    if (wasFirstSetup) state.activePage = 'dashboard';
                    showNotif(wasFirstSetup ? 'Data Identitas & Profil tersimpan! Selamat bekerja.' : 'Data Identitas Madrasah & Profil Anda berhasil diperbarui!');
                    renderApp();
                    return;
                }

                if (!fbDb) return;
                try {
                    await updateDoc(doc(fbDb, 'users_guru', state.currentUser.id), {
                        namaLengkap,
                        npk,
                        mapelAmpu,
                        identitasCompleted: true,
                        identitas: cleanIdentitas
                    });
                    state.currentUser = { ...state.currentUser, namaLengkap, npk, mapelAmpu, identitasCompleted: true };
                    state.needsIdentitySetup = false;
                    if (wasFirstSetup) state.activePage = 'dashboard';
                    showNotif(wasFirstSetup ? 'Data Identitas & Profil tersimpan ke akun Anda!' : 'Data Identitas Madrasah & Profil berhasil diperbarui!');
                    renderApp();
                } catch (err) {
                    console.error(err);
                    showNotif('Gagal menyimpan Data Identitas ke Firestore.', 'error');
                }
                return;
            }

            // Admin menyimpan ke settings_madrasah/profil_utama
            if (IS_PREVIEW) {
                showNotif('Identitas Madrasah & Logo berhasil disimpan!');
                return;
            }
            if (!fbDb) return;
            try {
                await setDoc(doc(fbDb, 'settings_madrasah', 'profil_utama'), {
                    ...state.identitas,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                showNotif('Identitas Madrasah & Logo berhasil disimpan ke Firestore!');
            } catch (err) {
                console.error(err);
                showNotif('Gagal menyimpan identitas madrasah.', 'error');
            }
        }

                    npk: npk.trim(),

                    identitas: createBlankIdentitas()

            if (!fbDb) return;
            try {
                await addDoc(collection(fbDb, 'users_guru'), {

        // =========================================================================
        // PARSER JSON AMAN & GENERATOR GAMBAR STIMULUS SOAL AI
        // =========================================================================
        function safeParseJsonText(rawText) {
            if (!rawText || typeof rawText !== 'string') {
                throw new Error('Respons server kosong. Periksa koneksi internet atau Gemini API Key Anda.');
            }
            let cleaned = rawText.trim();
            if (cleaned.startsWith('```')) {
                cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
            }
            return JSON.parse(cleaned);
        }

        function safeParseQuestionArray(rawText) {
            if (!rawText || typeof rawText !== 'string') {
                throw new Error('AI tidak mengembalikan teks jawaban. Coba kurangi jumlah soal per sesi atau periksa API Key.');
            }
            let cleaned = rawText.trim();
            if (cleaned.startsWith('```')) {
                cleaned = cleaned.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '').trim();
            }
            try {
                const parsed = JSON.parse(cleaned);
                if (Array.isArray(parsed)) return parsed;
                if (parsed && Array.isArray(parsed.soal)) return parsed.soal;
            } catch (_) {
                const startIdx = cleaned.indexOf('[');
                const lastCloseBrace = cleaned.lastIndexOf('}');
                if (startIdx !== -1 && lastCloseBrace > startIdx) {
                    const salvaged = cleaned.slice(startIdx, lastCloseBrace + 1) + ']';
                    try {
                        const recovered = JSON.parse(salvaged);
                        if (Array.isArray(recovered) && recovered.length > 0) {
                            return recovered;
                        }
                    } catch (e2) {}
                }
                throw new Error('Format output AI terpotong atau tidak valid. Silakan klik Generate ulang.');
            }
            throw new Error('Respons AI tidak berupa daftar soal.');
        }

        function createFallbackEducationalIllustration(soalText, mapelText) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                canvas.width = 480;
                canvas.height = 240;
                const ctx = canvas.getContext('2d');

                const grad = ctx.createLinearGradient(0, 0, 480, 240);
                grad.addColorStop(0, '#F8FAFC');
                grad.addColorStop(1, '#EEF2F6');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 480, 240);

                ctx.strokeStyle = '#94A3B8';
                ctx.lineWidth = 2;
                ctx.strokeRect(8, 8, 464, 224);

                ctx.fillStyle = '#0F172A';
                ctx.font = 'bold 13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`STIMULUS VISUAL — ${(mapelText || 'MADRASAH').toUpperCase()}`, 240, 32);

                ctx.beginPath();
                ctx.moveTo(40, 44);
                ctx.lineTo(440, 44);
                ctx.strokeStyle = '#CBD5E1';
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(240, 92, 24, 0, Math.PI * 2);
                ctx.fillStyle = '#FEF3C7';
                ctx.fill();
                ctx.strokeStyle = '#D97706';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.fillStyle = '#B45309';
                ctx.font = 'bold 18px serif';
                ctx.fillText('۞', 240, 98);

                ctx.fillStyle = '#1E293B';
                ctx.font = '12px sans-serif';
                const clean = String(soalText || 'Amati ilustrasi berikut dengan cermat.').replace(/\s+/g, ' ').trim();
                const words = clean.split(' ');
                const lines = [];
                let line = '';
                for (let i = 0; i < words.length; i++) {
                    const test = line + words[i] + ' ';
                    if (ctx.measureText(test).width > 400 && i > 0) {
                        lines.push(line.trim());
                        line = words[i] + ' ';
                    } else {
                        line = test;
                    }
                    if (lines.length >= 4) break;
                }
                if (lines.length < 4 && line.trim()) lines.push(line.trim());

                lines.forEach((ln, idx) => {
                    ctx.fillText(ln, 240, 142 + idx * 18);
                });

                resolve(canvas.toDataURL('image/png'));
            });
        }

        async function generateAIQuestionImage(soalText, mapelText, customApiKey) {
            const apiKey = (customApiKey || '').trim();
            const imagePrompt = `Create a clean, clear black-and-white or soft educational textbook line-art illustration for an Indonesian Madrasah exam question (${mapelText}). No text or letters inside the image. Subject context: ${String(soalText || '').slice(0, 220)}`;

            const modelsToTry = ['gemini-2.5-flash-image', 'gemini-2.0-flash-exp-image-generation'];

            for (let m = 0; m < modelsToTry.length; m++) {
                try {
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelsToTry[m]}:generateContent?key=${apiKey}`;
                    const payload = {
                        contents: [{ parts: [{ text: imagePrompt }] }],
                        generationConfig: { responseModalities: ['IMAGE'] }
                    };

                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!res.ok) continue;

                    const rawText = await res.text();
                    const data = safeParseJsonText(rawText);
                    const parts = data?.candidates?.[0]?.content?.parts || [];
                    const imgPart = parts.find(p => p.inlineData && p.inlineData.data);
                    if (imgPart) {
                        const mime = imgPart.inlineData.mimeType || 'image/png';
                        return `data:${mime};base64,${imgPart.inlineData.data}`;
                    }
                } catch (e) {
                    // Lanjut ke model cadangan
                }
            }

            return await createFallbackEducationalIllustration(soalText, mapelText);
        }

        // =========================================================================
        // GENERATOR SOAL AI (GEMINI + SMART BATCHING + GAMBAR + ACAK KUNCI ABCDE)
        // =========================================================================
        async function generateAIQuestions(params, onProgress) {
            const {
                jenjang, kelas, mapel, kurikulum, materi,
                bentukSoalList, levelKognitifList, jumlahOpsiPG,
                sertakanGambar, jumlahSoalGambar, customApiKey,
                existingQuestions = [], startNumberOffset = 0
            } = params;
            const totalSoal = bentukSoalList.reduce((acc, item) => acc + (parseInt(item.jumlah, 10) || 0), 0);
            const rincianLevel = levelKognitifList.join(', ');
            const opsiCount = parseInt(jumlahOpsiPG, 10) || 4;
            const apiKey = (customApiKey || '').trim();
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const expandedSlots = [];
            bentukSoalList.forEach(item => {
                const qty = parseInt(item.jumlah, 10) || 0;
                for (let k = 0; k < qty; k++) {
                    expandedSlots.push(item.nama);
                }
            });

            const BATCH_SIZE = 12;
            const batches = [];
            for (let i = 0; i < expandedSlots.length; i += BATCH_SIZE) {
                batches.push(expandedSlots.slice(i, i + BATCH_SIZE));
            }

            const requestSingleBatch = async (slotSlice, startNum, existingStems) => {
                const batchCount = slotSlice.length;
                const countByType = {};
                slotSlice.forEach(t => { countByType[t] = (countByType[t] || 0) + 1; });
                const rincianBatch = Object.entries(countByType)
                    .map(([nama, jml]) => `- ${jml} soal bentuk ${nama}`)
                    .join('\n');

                const avoidInstruction = existingStems.length > 0
                    ? `\nHINDARI DUPLIKASI dengan ${existingStems.length} soal yang sudah dibuat sebelumnya (topik/pertanyaan berikut jangan diulang): ${existingStems.slice(-15).join(' | ')}`
                    : '';

                const prompt = `Bertindaklah sebagai pakar pembuat soal asesmen pendidikan Madrasah (Kementerian Agama RI).
Buatlah TEPAT ${batchCount} butir soal (nomor ${startNum} sampai ${startNum + batchCount - 1}) untuk jenjang ${jenjang} Kelas ${kelas}, mata pelajaran ${mapel} dengan rincian bentuk soal berikut:
${rincianBatch}

Kurikulum: ${kurikulum}.
Capaian / Tujuan / Materi Pokok: ${materi}.
Level Kognitif yang digunakan: ${rincianLevel}.
${sertakanGambar ? `CATATAN STIMULUS GAMBAR: Buatlah beberapa soal yang menyertakan stimulus ilustrasi visual (misalnya diawali "Perhatikan gambar ilustrasi berikut! ...").` : ''}
${avoidInstruction}

ATURAN WAJIB:
1. Jumlah elemen array JSON HARUS TEPAT ${batchCount} objek (tidak boleh kurang dan tidak boleh lebih).
2. Untuk soal Pilihan Ganda, berikan tepat ${opsiCount} pilihan jawaban (A sampai ${opsiCount === 5 ? 'E' : 'D'}) tanpa awalan huruf "A. " di dalam array pilihan, dan distribusikan kunci jawaban secara acak dan merata.
3. Untuk Pilihan Ganda Kompleks, berikan ${opsiCount} pernyataan/pilihan.
4. Untuk Benar/Salah, isi pilihan dengan ["Benar", "Salah"].
5. Untuk Isian Singkat atau Uraian (Essay), kosongkan array pilihan: [].
6. Buat pembahasan singkat, padat, dan jelas (maksimal 2 kalimat) agar output JSON lengkap dan tidak terpotong.

Keluarkan respons murni JSON array of objects tanpa markdown:
[
  {
    "nomor": ${startNum},
    "kompetensi": "string (CP/TP)",
    "materi": "string",
    "indikatorSoal": "string",
    "levelKognitif": "string (misal: C3 - Aplikasi)",
    "tingkatKesulitan": "Mudah|Sedang|Sulit",
    "bentukSoal": "string",
    "soal": "string (pertanyaan lengkap)",
    "pilihan": ["opsi 1", "opsi 2", "opsi 3", "opsi 4"],
    "kunciJawaban": "string (contoh: A. Opsi 1)",
    "pembahasan": "string"
  }
]`;

                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json",
                        temperature: 0.7,
                        maxOutputTokens: 16384
                    }
                };

                let response = null;
                const delays = [1000, 2000, 4000];
                for (let attempt = 0; attempt <= delays.length; attempt++) {
                    try {
                        response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (response.ok) break;
                        if (attempt < delays.length && (response.status === 429 || response.status >= 500)) {
                            await new Promise(r => setTimeout(r, delays[attempt]));
                            continue;
                        }
                        break;
                    } catch (netErr) {
                        if (attempt === delays.length) {
                            throw new Error('Gagal terhubung ke server Gemini AI. Periksa koneksi internet Anda.');
                        }
                        await new Promise(r => setTimeout(r, delays[attempt]));
                    }
                }

                const rawResponseText = await response.text();
                if (!response.ok) {
                    let errMsg = `Permintaan AI gagal (HTTP ${response.status}).`;
                    try {
                        const errObj = safeParseJsonText(rawResponseText);
                        if (errObj?.error?.message) errMsg = errObj.error.message;
                    } catch (_) {}
                    throw new Error(errMsg);
                }

                const result = safeParseJsonText(rawResponseText);
                const jsonText = result?.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!jsonText) {
                    const finishReason = result?.candidates?.[0]?.finishReason || 'EMPTY';
                    throw new Error(`AI tidak menghasilkan teks soal (Status: ${finishReason}).`);
                }

                return safeParseQuestionArray(jsonText);
            };

            let collectedQuestions = [];
            const baseStems = Array.isArray(existingQuestions)
                ? existingQuestions.map(q => String(q.soal || '').slice(0, 65))
                : [];

            for (let bIdx = 0; bIdx < batches.length; bIdx++) {
                const slice = batches[bIdx];
                if (typeof onProgress === 'function') {
                    onProgress(`Menyusun paket soal ${bIdx + 1} dari ${batches.length} (${collectedQuestions.length}/${totalSoal} soal siap)...`);
                }
                const existingStems = baseStems.concat(collectedQuestions.map(q => String(q.soal || '').slice(0, 65)));
                const batchItems = await requestSingleBatch(slice, startNumberOffset + collectedQuestions.length + 1, existingStems);
                collectedQuestions = collectedQuestions.concat(batchItems);
            }

            let safetyRetry = 0;
            while (collectedQuestions.length < totalSoal && safetyRetry < 3) {
                safetyRetry++;
                const deficit = totalSoal - collectedQuestions.length;
                const missingSlots = expandedSlots.slice(collectedQuestions.length, collectedQuestions.length + Math.min(deficit, BATCH_SIZE));
                if (missingSlots.length === 0) break;

                if (typeof onProgress === 'function') {
                    onProgress(`Melengkapi sisa ${deficit} butir soal (${collectedQuestions.length}/${totalSoal})...`);
                }
                const existingStems = baseStems.concat(collectedQuestions.map(q => String(q.soal || '').slice(0, 65)));
                const extraItems = await requestSingleBatch(missingSlots, startNumberOffset + collectedQuestions.length + 1, existingStems);
                if (!extraItems || extraItems.length === 0) break;
                collectedQuestions = collectedQuestions.concat(extraItems);
            }

            const finalQuestions = collectedQuestions.slice(0, totalSoal).map((q, idx) => ({
                ...q,
                nomor: startNumberOffset + idx + 1,
                gambar: ''
            }));

            if (sertakanGambar && finalQuestions.length > 0) {
                const targetCount = jumlahSoalGambar === 'all'
                    ? finalQuestions.length
                    : Math.min(finalQuestions.length, parseInt(jumlahSoalGambar, 10) || 1);

                for (let i = 0; i < targetCount; i++) {
                    if (typeof onProgress === 'function') {
                        onProgress(`Membuat ilustrasi gambar AI untuk soal ke-${i + 1} dari ${targetCount}...`);
                    }
                    const imgDataUrl = await generateAIQuestionImage(finalQuestions[i].soal, mapel, apiKey);
                    if (imgDataUrl) {
                        finalQuestions[i].gambar = imgDataUrl;
                    }
                }
            }

            return finalQuestions;
        }

        async function handleGenerateQuestions() {
            const selectedBentuk = Object.entries(state.formGen.bentukSoalConfig)
                .filter(([_, val]) => val.checked && parseInt(val.jumlah, 10) > 0)
                .map(([nama, val]) => ({ nama, jumlah: parseInt(val.jumlah, 10) }));

            const selectedLevel = Object.entries(state.formGen.levelKognitifChecked)
                .filter(([_, isChecked]) => isChecked)
                .map(([nama]) => nama);

            if (!state.formGen.mapel.trim() || !state.formGen.materi.trim()) {
                showNotif('Harap lengkapi Mata Pelajaran dan Capaian/Materi Pokok!', 'error');
                return;
            }
            if (selectedBentuk.length === 0) {
                showNotif('Pilih minimal satu bentuk soal beserta jumlah butirnya!', 'error');
                return;
            }
            if (selectedLevel.length === 0) {
                showNotif('Pilih minimal satu level kognitif!', 'error');
                return;
            }

            state.isGenerating = true;
            state.generatingStatus = 'Menyusun butir soal & indikator asesmen...';
            state.activePage = 'workspace';
            state.resultTab = 'editor';
            renderApp();

            try {
                const rawQuestions = await generateAIQuestions({
                    jenjang: state.identitas.jenjang,
                    kelas: state.formGen.kelas,
                    mapel: state.formGen.mapel,
                    kurikulum: state.formGen.kurikulum,
                    materi: state.formGen.materi,
                    bentukSoalList: selectedBentuk,
                    levelKognitifList: selectedLevel,
                    jumlahOpsiPG: state.formGen.jumlahOpsiPG,
                    sertakanGambar: state.formGen.sertakanGambar,
                    jumlahSoalGambar: state.formGen.jumlahSoalGambar,
                    customApiKey: state.formGen.customApiKey
                }, (statusText) => {
                    state.generatingStatus = statusText;
                    renderApp();
                });

                const balancedQuestions = shuffleAndBalanceChoices(rawQuestions);
                state.bankSoal = balancedQuestions;
                state.activeArchiveId = null;
                state.generationCount += 1;
                showNotif(`Berhasil menyusun ${balancedQuestions.length} butir soal dengan kunci ABCDE acak & merata!`);
            } catch (err) {
                console.error(err);
                showNotif(err?.message || 'Gagal menggenerate soal AI. Periksa koneksi atau API Key Anda.', 'error');
            } finally {
                state.isGenerating = false;
                state.generatingStatus = '';
                renderApp();
            }
        }

        async function handleAppendAiQuestions(e) {
            e.preventDefault();
            const { bentukSoal, jumlah, materiTambahan } = state.appendAiModal;
            const qty = parseInt(jumlah, 10) || 0;
            if (qty < 1 || qty > 60) {
                showNotif('Masukkan jumlah soal tambahan antara 1 sampai 60 butir!', 'error');
                return;
            }

            const selectedLevel = Object.entries(state.formGen.levelKognitifChecked)
                .filter(([_, isChecked]) => isChecked)
                .map(([nama]) => nama);
            const activeLevels = selectedLevel.length > 0
                ? selectedLevel
                : ['LOTS (Pemahaman - C1, C2)', 'MOTS (Aplikasi - C3)', 'HOTS (Penalaran - C4, C5, C6)'];

            state.appendAiModal.open = false;
            state.isGenerating = true;
            state.generatingStatus = `Menyiapkan ${qty} soal tambahan untuk melengkapi paket...`;
            renderApp();

            try {
                const topik = materiTambahan.trim() || state.formGen.materi || state.formGen.mapel;
                const extraQuestions = await generateAIQuestions({
                    jenjang: state.identitas.jenjang,
                    kelas: state.formGen.kelas,
                    mapel: state.formGen.mapel,
                    kurikulum: state.formGen.kurikulum,
                    materi: topik,
                    bentukSoalList: [{ nama: bentukSoal, jumlah: qty }],
                    levelKognitifList: activeLevels,
                    jumlahOpsiPG: state.formGen.jumlahOpsiPG,
                    sertakanGambar: false,
                    jumlahSoalGambar: '0',
                    customApiKey: state.formGen.customApiKey,
                    existingQuestions: state.bankSoal,
                    startNumberOffset: state.bankSoal.length
                }, (statusText) => {
                    state.generatingStatus = statusText;
                    renderApp();
                });

                const combined = state.bankSoal.concat(extraQuestions).map((item, idx) => ({
                    ...item,
                    nomor: idx + 1
                }));
                state.bankSoal = shuffleAndBalanceChoices(combined);
                state.generationCount += 1;
                showNotif(`Berhasil menambahkan ${extraQuestions.length} soal! Total sekarang ${state.bankSoal.length} soal. Klik "Perbarui Arsip" untuk menyimpan.`);
            } catch (err) {
                console.error(err);
                showNotif(err?.message || 'Gagal menambahkan soal AI. Periksa koneksi atau API Key Anda.', 'error');
            } finally {
                state.isGenerating = false;
                state.generatingStatus = '';
                renderApp();
            }
        }

        async function handleGenerateSingleQuestionImage(idx) {
            const q = state.bankSoal[idx];
            if (!q) return;
            state.generatingImgIdx = idx;
            renderApp();
            try {
                const imgData = await generateAIQuestionImage(q.soal, state.formGen.mapel, state.formGen.customApiKey);
                if (imgData) {
                    state.bankSoal[idx].gambar = imgData;
                    showNotif(`Ilustrasi gambar otomatis berhasil dibuat untuk soal No. ${idx + 1}!`);
                } else {
                    showNotif('Gagal membuat ilustrasi gambar AI.', 'error');
                }
            } finally {
                state.generatingImgIdx = -1;
                renderApp();
            }
        }

        function buildRekapKunciTableHtml(bankSoal) {
            const chunkSize = 20;
            const chunks = [];
            for (let i = 0; i < bankSoal.length; i += chunkSize) {
                chunks.push({ start: i, items: bankSoal.slice(i, i + chunkSize) });
            }

            return `
                <div style="margin-top:16px; padding-top:8px; border-top:1px dashed #000; page-break-inside:avoid; line-height:1.15;">
                    <div style="font-size:9.5pt; font-weight:bold; text-transform:uppercase; margin-bottom:4px;">Rekap Kunci Jawaban:</div>
                    ${chunks.map(ch => `
                        <table border="1" style="width:100%; border-collapse:collapse; font-size:8.5pt; text-align:center; margin-bottom:4px;">
                            <tr style="background:#f3f4f6;">
                                ${ch.items.map((_, idx) => `<th style="border:1px solid #000; padding:2px;">${ch.start + idx + 1}</th>`).join('')}
                            </tr>
                            <tr>
                                ${ch.items.map(s => {
                                    const m = String(s.kunciJawaban || '').match(/^([A-E])/i);
                                    const letter = m ? m[1].toUpperCase() : (String(s.kunciJawaban || '').trim().charAt(0) || '-');
                                    return `<td style="border:1px solid #000; padding:2px; font-weight:bold; color:#065f46;">${escapeHtml(letter)}</td>`;
                                }).join('')}
                            </tr>
                        </table>
                    `).join('')}
                </div>
            `;
        }

                (a.jenisAsesmen || '').toLowerCase().includes(q) ||

                (a.penyusunNama || '').toLowerCase().includes(q)

        function renderApp() {

                root.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-[#FAF6F0]">

                        </div>
                    </div>
                    <div id="modal-root"></div>

                return;
            }

            if (!state.currentUser) {
                root.innerHTML = `${renderAuthScreen()}<div id="modal-root"></div>`;
                bindAuthEvents();
                renderModals();
                try { if (window.lucide) window.lucide.createIcons(); } catch (e) {}
                return;
            }

            if (state.currentUser.role === 'guru' && state.needsIdentitySetup && state.activePage !== 'identitas') {
                state.activePage = 'identitas';
            }

            const isDark = state.themeMode === 'dark';
            let pageContent = '';
            switch (state.activePage) {
                case 'dashboard': pageContent = renderDashboardPage(); break;
                case 'daftar-guru': pageContent = renderDaftarGuruPage(); break;
                case 'generator': pageContent = renderGeneratorPage(); break;
                case 'workspace': pageContent = renderWorkspacePage(); break;
                case 'bank': pageContent = renderBankSoalPage(); break;
                case 'identitas': pageContent = renderIdentitasPage(); break;
                default: pageContent = renderDashboardPage();
            }

            root.innerHTML = `
                <div class="min-h-screen w-full flex ${isDark ? 'bg-[#121315] text-white' : 'bg-[#FAF6F0] text-[#141517]'}">
                    ${renderDesktopSidebar()}
                    <main class="flex-1 min-w-0 pb-24 md:pb-8 overflow-y-auto">
                        ${pageContent}
                    </main>
                    ${renderMobileBottomNav()}
                </div>
                <div id="modal-root"></div>
            `;

            bindAppEvents();
            renderModals();
            try { if (window.lucide) window.lucide.createIcons(); } catch (e) {}
        }

        function bindAuthEvents() {
            document.querySelectorAll('[data-auth-tab]').forEach(btn => {
                btn.onclick = () => {
                    state.authTab = btn.getAttribute('data-auth-tab');
                    state.authMode = 'login';
                    renderApp();
                };
            });

            document.querySelectorAll('[data-auth-mode]').forEach(btn => {
                btn.onclick = () => {
                    state.authMode = btn.getAttribute('data-auth-mode');
                    renderApp();
                };
            });

            const togglePass = document.getElementById('toggle-auth-pass');
            if (togglePass) {
                togglePass.onclick = () => {
                    state.showAuthPass = !state.showAuthPass;
                    renderApp();
                };
            }

            const loginUser = document.getElementById('login-username');
            const loginPass = document.getElementById('login-password');
            if (loginUser) loginUser.oninput = (e) => { state.loginForm.username = e.target.value; };
            if (loginPass) loginPass.oninput = (e) => { state.loginForm.password = e.target.value; };

            const formLogin = document.getElementById('form-login');
            if (formLogin) formLogin.onsubmit = handleLoginSubmit;

            const regNama = document.getElementById('reg-nama');
            const regUser = document.getElementById('reg-username');
            const regPass = document.getElementById('reg-password');
            const regConf = document.getElementById('reg-confirm-password');
            if (regNama) regNama.oninput = (e) => { state.registerForm.namaLengkap = e.target.value; };
            if (regUser) regUser.oninput = (e) => { state.registerForm.username = e.target.value; };
            if (regPass) regPass.oninput = (e) => { state.registerForm.password = e.target.value; };
            if (regConf) regConf.oninput = (e) => { state.registerForm.confirmPassword = e.target.value; };

            const upKiri = document.getElementById('upload-logo-kiri');
            if (upKiri) {
                upKiri.onchange = async (e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    state.identitas.logoKiri = await processLogoTransparent(file, 300);
                    showNotif('Logo Kiri diunggah & background dihapus otomatis (PNG transparan)!');
                    renderApp();
                };
            }
            const upKanan = document.getElementById('upload-logo-kanan');
            if (upKanan) {
                upKanan.onchange = async (e) => {
                    const file = e.target.files?.[0];
                    if (!file) return;
                    state.identitas.logoKanan = await processLogoTransparent(file, 300);
                    showNotif('Logo Kanan diunggah & background dihapus otomatis (PNG transparan)!');
                    renderApp();
                };
            }

            const btnSaveId = document.getElementById('btn-save-identitas');
            if (btnSaveId) btnSaveId.onclick = handleSaveIdentitas;
        }

        function bindModalEvents() {
            const bindVal = (id, setter) => {
                const el = document.getElementById(id);
                if (el) el.oninput = (e) => setter(e.target.value);
            };

            const closeEdit = () => {
                state.editModal = { open: false, index: -1, data: null };
                renderModals();
            };
            const btnCloseEdit = document.getElementById('close-edit-modal');
            if (btnCloseEdit) btnCloseEdit.onclick = closeEdit;
            const btnCancelEdit = document.getElementById('cancel-edit-modal');
            if (btnCancelEdit) btnCancelEdit.onclick = closeEdit;

            if (state.editModal.open && state.editModal.data) {
                bindVal('edit-soal-text', v => { state.editModal.data.soal = v; });
                bindVal('edit-level', v => { state.editModal.data.levelKognitif = v; });
                bindVal('edit-kunci', v => { state.editModal.data.kunciJawaban = v; });
                bindVal('edit-pembahasan', v => { state.editModal.data.pembahasan = v; });

                const editBentuk = document.getElementById('edit-bentuk');
                if (editBentuk) {
                    editBentuk.onchange = (e) => {
                        const val = e.target.value;
                        state.editModal.data.bentukSoal = val;
                        if (val === 'Pilihan Ganda' || val === 'Pilihan Ganda Kompleks') {
                            const cnt = parseInt(state.formGen.jumlahOpsiPG, 10) || 4;
                            if (!state.editModal.data.pilihan || state.editModal.data.pilihan.length === 0) {
                                state.editModal.data.pilihan = Array.from({ length: cnt }, () => '');
                            }
                        } else if (val === 'Benar/Salah') {
                            state.editModal.data.pilihan = ['Benar', 'Salah'];
                        } else {
                            state.editModal.data.pilihan = [];
                        }
                        renderModals();
                    };
                }

                document.querySelectorAll('[data-edit-opt]').forEach(inp => {
                    inp.oninput = () => {
                        const i = parseInt(inp.getAttribute('data-edit-opt'), 10);
                        state.editModal.data.pilihan[i] = inp.value;
                    };
                });

                const btnModalAiImg = document.getElementById('btn-modal-ai-img');
                if (btnModalAiImg) {
                    btnModalAiImg.onclick = async () => {
                        state.modalGeneratingImg = true;
                        renderModals();
                        try {
                            const imgData = await generateAIQuestionImage(
                                state.editModal.data.soal,
                                state.formGen.mapel,
                                state.formGen.customApiKey
                            );
                            if (imgData) {
                                state.editModal.data.gambar = imgData;
                                showNotif('Ilustrasi gambar AI berhasil dibuat!');
                            } else {
                                showNotif('Gagal membuat ilustrasi gambar AI.', 'error');
                            }
                        } finally {
                            state.modalGeneratingImg = false;
                            renderModals();
                        }
                    };
                }

                const editUpImg = document.getElementById('edit-upload-gambar');
                if (editUpImg) {
                    editUpImg.onchange = async (e) => {
                        const file = e.target.files?.[0];
                        if (!file) return;
                        state.editModal.data.gambar = await compressImageFile(file, 480, 0.8);
                        renderModals();
                    };
                }

                const editDelImg = document.getElementById('edit-hapus-gambar');
                if (editDelImg) {
                    editDelImg.onclick = () => {
                        state.editModal.data.gambar = '';
                        renderModals();
                    };
                }

                const btnSaveEdit = document.getElementById('save-edit-modal');
                if (btnSaveEdit) {
                    btnSaveEdit.onclick = () => {
                        if (!state.editModal.data.soal.trim()) {
                            showNotif('Teks pertanyaan soal tidak boleh kosong!', 'error');
                            return;
                        }
                        if (state.editModal.index === -1) {
                            state.bankSoal.push({ ...state.editModal.data, nomor: state.bankSoal.length + 1 });
                            showNotif('Butir soal baru berhasil ditambahkan!');
                        } else {
                            state.bankSoal[state.editModal.index] = state.editModal.data;
                            showNotif('Perubahan butir soal disimpan!');
                        }
                        closeEdit();
                        renderApp();
                    };
                }
            }

            // Guru Modal bindings
            const closeGuru = () => {
                state.guruModal = { open: false, namaLengkap: '', username: '', password: '', npk: '', mapelAmpu: '' };
                renderModals();
            };
            const btnCloseGuru = document.getElementById('close-guru-modal');
            if (btnCloseGuru) btnCloseGuru.onclick = closeGuru;
            const btnCancelGuru = document.getElementById('cancel-guru-modal');
            if (btnCancelGuru) btnCancelGuru.onclick = closeGuru;
            bindVal('gm-nama', v => { state.guruModal.namaLengkap = v; });
            bindVal('gm-user', v => { state.guruModal.username = v; });
            bindVal('gm-pass', v => { state.guruModal.password = v; });
            bindVal('gm-npk', v => { state.guruModal.npk = v; });
            bindVal('gm-mapel', v => { state.guruModal.mapelAmpu = v; });
            const formAddGuru = document.getElementById('form-admin-add-guru');
            if (formAddGuru) formAddGuru.onsubmit = handleAddGuruByAdmin;

            // Reset Pass Modal bindings
            const closeReset = () => {
                state.resetPassModal = { open: false, guruId: '', guruNama: '', newPassword: '' };
                renderModals();
            };
            const btnCloseReset = document.getElementById('close-reset-modal');
            if (btnCloseReset) btnCloseReset.onclick = closeReset;
            const btnCancelReset = document.getElementById('cancel-reset-modal');
            if (btnCancelReset) btnCancelReset.onclick = closeReset;
            bindVal('rp-new-pass', v => { state.resetPassModal.newPassword = v; });
            const formReset = document.getElementById('form-reset-pass');
            if (formReset) formReset.onsubmit = handleResetPasswordGuru;

            // Agenda Modal bindings
            const closeAgenda = () => {
                state.agendaModal.open = false;
                renderModals();
            };
            const btnCloseAg = document.getElementById('close-agenda-modal');
            if (btnCloseAg) btnCloseAg.onclick = closeAgenda;
            const btnCancelAg = document.getElementById('cancel-agenda-modal');
            if (btnCancelAg) btnCancelAg.onclick = closeAgenda;
            bindVal('ag-day', v => { state.agendaModal.dayNum = v; });
            bindVal('ag-month', v => { state.agendaModal.monthShort = v; });
            bindVal('ag-judul', v => { state.agendaModal.judul = v; });
            bindVal('ag-waktu', v => { state.agendaModal.waktu = v; });
            const formAddAgenda = document.getElementById('form-add-agenda');
            if (formAddAgenda) formAddAgenda.onsubmit = handleAddAgenda;

            // Append AI Modal bindings
            const closeAppendAi = () => {
                state.appendAiModal.open = false;
                renderModals();
            };
            const btnCloseAppend = document.getElementById('close-append-ai');
            if (btnCloseAppend) btnCloseAppend.onclick = closeAppendAi;
            const btnCancelAppend = document.getElementById('cancel-append-ai');
            if (btnCancelAppend) btnCancelAppend.onclick = closeAppendAi;
            bindVal('append-bentuk', v => { state.appendAiModal.bentukSoal = v; });
            bindVal('append-qty', v => { state.appendAiModal.jumlah = v; });
            bindVal('append-materi', v => { state.appendAiModal.materiTambahan = v; });
            const formAppendAi = document.getElementById('form-append-ai');
            if (formAppendAi) formAppendAi.onsubmit = handleAppendAiQuestions;

            // Confirm Modal bindings
            const closeConfirm = () => {
                state.confirmModal = { open: false, title: '', message: '', onConfirm: null };
                renderModals();
            };
            const btnCancelConf = document.getElementById('cancel-confirm-modal');
            if (btnCancelConf) btnCancelConf.onclick = closeConfirm;
            const btnOkConf = document.getElementById('ok-confirm-modal');
            if (btnOkConf) {
                btnOkConf.onclick = async () => {
                    const fn = state.confirmModal.onConfirm;
                    closeConfirm();
                    if (typeof fn === 'function') await fn();
                };
            }
        }

        // Render awal aplikasi segera saat module dieksekusi
        renderApp();
    </script>
</body>
</html>
